<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="共通/見た目の決まり.css">
<link rel="manifest" href="共通/アプリの設定.webmanifest">
<link rel="apple-touch-icon" href="共通/アプリのアイコン_iPhone用_180.png">
<meta name="theme-color" content="#FBFAF7">

<meta name="mobile-web-app-capable" content="yes">

<style>
  /* ホームだけの見た目。区切りは線と余白。影なし */
  .page { padding-left: var(--s5); padding-right: var(--s5); }
  .home-top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--s3); padding: var(--s5) var(--s5) var(--s3); border-bottom: 1px solid var(--sumi); }
  .home-brand { display: inline-flex; align-items: center; min-height: 48px; font-family: var(--mincho); font-weight: 600; font-size: 1.125rem; letter-spacing: 0.2em; color: var(--sumi); text-decoration: none; white-space: nowrap; }
  .who-pick { display: flex; flex-wrap: wrap; gap: var(--s4); font-size: 15px; }
  .who-pick a { min-height: 48px; min-width: 48px; justify-content: center; display: flex; align-items: flex-end; padding-bottom: 4px; color: var(--sumi-2); text-decoration: none; white-space: nowrap; }
  .who-pick a[aria-current] { color: var(--sumi); font-weight: 700; box-shadow: inset 0 -2px 0 var(--sumi); }
  .home-lang { display: flex; justify-content: flex-end; padding: var(--s2) var(--s5) 0; }
  .home-date { margin: var(--s5) 0 0; font-size: 14px; color: var(--sumi-2); letter-spacing: 0.12em; }
  .home-h1 { font-family: var(--mincho); font-weight: 600; font-size: 1.875rem; line-height: 1.45; margin: var(--s1) 0 0; letter-spacing: 0.06em; }
  body:not(.role-shokunin) .home-h1 { font-size: 1.625rem; letter-spacing: 0.03em; }
  .main-block { margin: var(--s5) 0 0; padding: var(--s5) 0 var(--s5); border-top: 1px solid var(--sen); border-bottom: 1px solid var(--sen); }
  .from { display: flex; align-items: center; gap: var(--s3); font-size: 15px; color: var(--sumi-2); margin: 0; }
  .hanko { min-width: 40px; height: 40px; padding: 0 4px; flex: none; border: 2px solid var(--shu); color: var(--shu); font-family: var(--mincho); font-weight: 700; font-size: 14px; line-height: 1.1; display: grid; place-items: center; text-align: center; transform: rotate(-4deg); border-radius: 3px; }
  .hanko--sumi { border-color: var(--sumi-2); color: var(--sumi-2); }
  .quote { margin: var(--s4) 0 var(--s2); font-family: var(--mincho); font-size: 1.25rem; line-height: 1.7; letter-spacing: 0.03em; }
  .quote-note { margin: 0 0 var(--s4); font-size: 15px; color: var(--sumi-2); }
  .btn-urushi { display: flex; align-items: center; justify-content: center; min-height: 58px; border-radius: var(--r); background: var(--koke); color: var(--kin-moji); font-weight: 700; font-size: 1.125rem; letter-spacing: 0.12em; text-decoration: none; }
  .btn-line { display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: var(--r); border: 1px solid var(--sumi); color: var(--sumi); font-weight: 700; text-decoration: none; letter-spacing: 0.06em; }
  .home-h2 { font-family: var(--mincho); font-weight: 600; font-size: 1.1875rem; margin: var(--s6) 0 var(--s3); letter-spacing: 0.08em; }
  .tree { display: grid; grid-template-columns: 132px 1fr; gap: var(--s4); }
  .tree img { width: 132px; height: 164px; object-fit: cover; object-position: center 45%; border-radius: var(--r-s); display: block; background: var(--kami-2); }
  .tree-acts { display: flex; flex-direction: column; gap: var(--s3); }
  .tree-acts a { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: var(--s2) var(--s4); border: 1px solid var(--sumi); border-radius: var(--r); min-height: 72px; color: var(--sumi); text-decoration: none; }
  .tree-acts b { font-size: 1.125rem; letter-spacing: 0.1em; }
  .tree-acts small { font-size: 14px; color: var(--sumi-2); line-height: 1.4; }
  .tree-note { font-size: 14px; color: var(--sumi-2); margin: var(--s2) 0 0; }
  .menu { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--sen); }
  .menu a { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) 0; min-height: 64px; border-bottom: 1px solid var(--sen); color: var(--sumi); text-decoration: none; }
  .menu b { display: block; font-size: 1rem; }
  .menu small { display: block; font-size: 15px; color: var(--sumi-2); line-height: 1.5; }
  .menu .go { margin-left: auto; color: var(--sumi-2); flex: none; }
  .menu .count { margin-left: auto; flex: none; min-width: 26px; height: 26px; padding: 0 6px; border: 1.5px solid var(--shu); color: var(--shu); font-weight: 700; font-size: 14px; display: grid; place-items: center; border-radius: 2px; }
  .about { margin: var(--s6) 0 0; font-size: 15px; }
  .about a { display: inline-flex; align-items: center; min-height: 44px; }
  .home-photo-main { display: flex; align-items: center; justify-content: center; gap: var(--s3); }
  .about a { color: var(--sumi-2); }
  .loading { color: var(--sumi-2); font-size: 14px; }
  .home-top-right { display: flex; align-items: flex-end; gap: var(--s4); }
  /* 職人の画面は字を大きく（70歳の目でも読める） */
  body.role-shokunin .menu b { font-size: 1.25rem; }
  body.role-shokunin .menu small, body.role-shokunin .from, body.role-shokunin .quote-note, body.role-shokunin .tree-acts small, body.role-shokunin .tree-note, body.role-shokunin .home-date, body.role-shokunin .about { font-size: 1.0625rem; }
  body.role-shokunin .hanko { font-size: 1rem; min-width: 48px; height: 48px; }
  body.role-shokunin .menu .count { font-size: 1rem; min-width: 32px; height: 32px; }
  body.role-shokunin .tree-acts b { font-size: 1.25rem; }
  .home-follow { display: flex; align-items: center; min-height: 48px; margin-top: var(--s3); color: var(--sumi); font-size: 1.0625rem; }
  .hero-photo { margin: var(--s5) 0 0; }
  .hero-photo img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; object-position: center 45%; border-radius: var(--r-s); display: block; background: var(--kami-2); }
  .hero-photo figcaption { font-size: 14px; color: var(--sumi-2); margin-top: var(--s2); }
  /* 字間を広げるのは日本語のときだけ（英語などは詰める） */
  html:not([lang="ja"]) .home-h1, html:not([lang="ja"]) .home-h2, html:not([lang="ja"]) .quote, html:not([lang="ja"]) .btn-urushi { letter-spacing: 0.01em; }
  /* 海外の人の「あなたの相談」一覧。字は職人側と同じ大きさ、押せる行は48px以上 */
  .my-cons .menu a { min-height: 72px; }
  .my-cons .menu b { font-size: 1.25rem; font-weight: 700; }
  .my-cons .menu small { font-size: 1.0625rem; }
  .my-cons .menu .stat { margin-left: auto; flex: none; max-width: 40%; text-align: right; font-size: 1.0625rem; color: var(--sumi-2); }
  .my-cons .menu .stat.is-new { color: var(--shu); font-weight: 700; }
  .my-cons .menu .q { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  /* 海外の人のホーム：探す → 相談 → 答えが届く の3段 */
  .how { list-style: none; counter-reset: how; margin: var(--s5) 0 0; padding: 0; border-top: 1px solid var(--sen); }
  .how li { counter-increment: how; border-bottom: 1px solid var(--sen); }
  .how a, .how div { display: block; position: relative; padding: var(--s3) var(--s6) var(--s3) 2.75rem; min-height: 64px; color: var(--sumi); text-decoration: none; }
  .how a::after { content: "→"; position: absolute; right: 0; top: 50%; transform: translateY(-50%); color: var(--sumi-2); }
  .how a::before, .how div::before { content: counter(how); position: absolute; left: 0; top: var(--s2); font-family: var(--mincho); font-size: 1.625rem; color: var(--kin); }
  .how b { display: block; font-size: 1.0625rem; line-height: 1.5; }
  .how small { display: block; color: var(--sumi-2); font-size: 15px; line-height: 1.5; }
</style>
</head>
<body data-screen="00">
<script>
  /* 使う人（職人／海外の愛好家）を先に決める。ログインしている人の役割を一番に使う
     （このタブで最後に確かめた人。あとで /api/me で確かめ直す）。なければ URL の ?role=、その次に前回のまま */
  (function () {
    var KEY = "bonsai-home-role", q = new URLSearchParams(location.search).get("role"), r = null, u = null;
    try { u = JSON.parse(sessionStorage.getItem("bonsai-me") || "null"); } catch (e) { u = null; }
    try { r = (u && u.role) || q || localStorage.getItem(KEY); if (r) localStorage.setItem(KEY, r); } catch (e) { r = (u && u.role) || q; }
    /* まだ役割が決まっていないとき、日本語以外の言語のブラウザなら海外の愛好家の入口にする */
    if (!r && !/^ja/i.test(navigator.language || "ja")) r = "aikouka";
    if (r !== "aikouka") document.body.classList.add("role-shokunin");
  })();
</script>
<div class="app">
  <header class="home-top">
    <a class="home-brand" href="00_ホーム_職人と愛好家.html" title="ホーム">盆栽の間</a>
    <div class="home-top-right">
    <!-- ログインしている人の名前（押すとログアウト）。画面の共通の動き.js が入れる -->
    <div data-account></div>
    </div>
  </header>
  <div class="home-lang" id="lang-row" hidden></div>
  <main class="page"><div id="home"></div></main>
  <nav id="tabbar"></nav>
</div>
<script src="共通/用語集データ.js"></script>
<script src="共通/サンプルのデータ.js"></script>
<script src="共通/画面の共通の動き.js"></script>
<script src="共通/サーバーとのやりとり.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var shokunin = document.body.classList.contains("role-shokunin");
  var user = null;
  var $ = function (id) { return document.getElementById(id); };
  var home = $("home");
  var go = function (no) { return window.fileOf(no); };
  var LANG_JA = { en: "英語", es: "スペイン語", zh: "中国語", ja: "日本語" };

  /* 日付は漢数字で（例：十一月六日 金曜日） */
  function kansuji(n) {
    var d = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
    if (n < 10) return d[n];
    return (n >= 20 ? d[Math.floor(n / 10)] : "") + "十" + d[n % 10];
  }
  function today() {
    var t = new Date(), w = "日月火水木金土".charAt(t.getDay());
    return kansuji(t.getMonth() + 1) + "月" + kansuji(t.getDate()) + "日　" + w + "曜日";
  }
  /* title・note は、呼ぶ側で esc か tSpan を済ませた HTML を渡す */
  function li(href, title, note, right) {
    return '<li><a href="' + href + '"><span><b>' + title + "</b><small>" + note + "</small></span>" + (right || '<span class="go" aria-hidden="true">→</span>') + "</a></li>";
  }
  var failed = false;
  function getList(url, key) {
    if (!API.online) return Promise.resolve([]);
    return API.get(url).then(function (r) { return r[key] || []; }).catch(function () { failed = true; return []; });
  }

  /* ---------- 職人のホーム：届いた相談／撮るだけで投稿／紹介ページ ---------- */
  function drawShokunin(cons, trees) {
    var open = cons.filter(function (c) { return !c.answer; });
    var c = open[0];
    var tree = trees[0];
    var h = '<p class="home-date">' + today() + (user && user.name ? "　" + esc(user.name) + " さん" : "") + "</p>";
    if (c) {
      var fc = c.for_craftsperson || {};
      h += '<h1 class="home-h1">相談が' + kansuji(Math.min(open.length, 99)) + "件、<br>届いています。</h1>" +
        '<section class="main-block" aria-label="届いた相談">' +
        '<p class="from"><span class="hanko">新着</span>' + esc(LANG_JA[c.lang] || "海外") + "で届いた相談</p>" +
        '<p class="quote">「' + esc(API.dropTermMarks(fc.title_ja || "")) + "」</p>" +
        '<p class="quote-note">' + esc(LANG_JA[c.lang] || "相手の言葉") + "から訳しました。" + (c.image ? "写真が1枚ついています" : "写真はありません") + "</p>" +
        '<a class="btn-urushi" href="' + go("04") + "?id=" + encodeURIComponent(c.id) + '">答える</a></section>';
    } else {
      h += '<h1 class="home-h1">今日は、<br>どの木を撮りますか。</h1>' +
        '<section class="main-block" aria-label="今日やること">' +
        '<p class="quote-note" style="margin-top:0">撮るだけで、AIが英語・スペイン語・中国語の投稿の下書きを作ります。海外から相談が届くと、ここに日本語で出ます。</p>' +
        '<a class="btn-urushi" href="' + go("17") + '">写真を撮る</a>' +
        (tree ? '<a class="home-follow" href="' + go("17") + "?tree=" + encodeURIComponent(tree.id) + '">この木で投稿を作る　→</a>' : "") + "</section>";
    }
    var photo = tree && tree.image ? "data:" + esc(tree.image.media_type) + ";base64," + esc(tree.image.data) : "共通/見本の写真_盆栽.jpg";
    h += '<h2 class="home-h2">あなたの木と技を、世界へ</h2>' +
      '<div class="tree"><img src="' + photo + '" alt="' + (tree ? "あなたの木の写真" : "盆栽の写真") + '">' +
      '<div class="tree-acts">' +
      '<a href="' + go("17") + '"><b>撮る</b><small>写真から3か国語の投稿</small></a>' +
      '<a href="' + go("19") + '"><b>紹介ページ</b><small>話すだけで、3か国語の紹介</small></a>' +
      "</div></div>";
    h += '<h2 class="home-h2">できること</h2><ul class="menu">' +
      li(go("22"), "届いた相談", c ? "海外の人の質問が、日本語で届きます" : "海外の人からの質問が、ここに並びます", open.length > 1 ? '<span class="count" aria-label="答えていない相談">' + open.length + "</span>" : "") +
      li(go("17"), "撮るだけで投稿", "写真か動画から、海外向けの投稿の下書き。確かめて、ご自分で投稿します") +
      li(go("19"), "私の紹介ページ", "教えられることを話すだけで、紹介文が3か国語でできます") +
      "</ul>" +
      '<p class="about demo-only"><a href="index.html">この試作の紹介と、画面の一覧</a></p>';
    home.innerHTML = h;
  }

  /* 「あなたの相談」：答えが届いたものを上に、新しい順に最大3件 */
  function agoText(iso) {
    var ms = Date.now() - new Date(iso).getTime();
    if (!(ms >= 0)) return null;
    var m = Math.floor(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
    if (m < 60) return { ja: "いま", en: "just now", es: "ahora", zh: "刚刚" };
    if (h < 24) return { ja: h + "時間前", en: h + (h === 1 ? " hour ago" : " hours ago"), es: "hace " + h + (h === 1 ? " hora" : " horas"), zh: h + "小时前" };
    return { ja: d + "日前", en: d + (d === 1 ? " day ago" : " days ago"), es: "hace " + d + (d === 1 ? " día" : " días"), zh: d + "天前" };
  }
  function myConsultations(cons) {
    var t = window.tSpan;
    function time(c) { return new Date((c.answer && c.answer.at) || c.at || 0).getTime() || 0; }
    var list = cons.slice().sort(function (a, b) {
      var da = a.answer ? 1 : 0, db = b.answer ? 1 : 0;
      return da !== db ? db - da : time(b) - time(a);
    }).slice(0, 3);
    if (!list.length) return "";
    return '<section class="my-cons" aria-label="' + esc("Your questions") + '"><h2 class="home-h2">' + t({ ja: "あなたの相談", en: "Your questions", es: "Tus consultas", zh: "你的咨询" }) + '</h2><ul class="menu">' +
      list.map(function (c) {
        var q = String(c.question || "");
        var stat;
        if (c.answer) {
          stat = '<span class="stat is-new">' + t({ ja: "答えが届いた", en: "Answer received", es: "Respuesta recibida", zh: "已收到回答" }) + "</span>";
        } else {
          var ago = agoText(c.at);
          stat = '<span class="stat">' + t({ ja: "答え待ち", en: "Waiting for an answer", es: "Esperando respuesta", zh: "等待回答" }) +
            (ago ? "<br>" + t(ago) : "") + "</span>";
        }
        return '<li><a href="' + go("05") + "?id=" + encodeURIComponent(c.id) + '"><span><small class="q" lang="' + esc(c.lang || "en") + '">' + esc(API.dropTermMarks(q.slice(0, 80)) + (q.length > 80 ? "…" : "")) + "</small></span>" + stat + "</a></li>";
      }).join("") + "</ul></section>";
  }

  /* ---------- 海外の人のホーム（4か国語）：探す → 相談 → 答えが届く、学ぶ・用語集 ---------- */
  function drawAikouka(cons) {
    var t = window.tSpan;
    var done = cons.filter(function (c) { return c.answer; })[0];
    var hi = user && user.name ? '<p class="home-date">' + t({ ja: "こんにちは、", en: "Hello, ", es: "Hola, ", zh: "你好，" }) + esc(user.name) + "</p>" : "";
    var h = hi + '<h1 class="home-h1">' + t({ ja: "日本の盆栽職人に、母語のまま聞けます。", en: "Ask a Japanese bonsai craftsperson, in your own language.", es: "Pregunta a un maestro de bonsái japonés, en tu idioma.", zh: "用你的母语，向日本盆栽匠人请教。" }) + "</h1>";
    if (done) {
      h += '<section class="main-block" aria-label="answer">' +
        '<p class="from"><span class="hanko">' + t({ ja: "回答", en: "New", es: "Nuevo", zh: "新" }) + "</span>" + t({ ja: "職人から答えが届きました", en: "A craftsperson answered you", es: "Un maestro te respondió", zh: "匠人回复了你" }) + "</p>" +
        '<p class="quote" lang="' + esc(done.lang || "en") + '">' + esc(API.dropTermMarks((done.answer && done.answer.headline) || "")) + "</p>" +
        '<p class="quote-note">' + t({ ja: "あなたの質問：", en: "Your question: ", es: "Tu pregunta: ", zh: "你的问题：" }) + esc(String(done.question || "").slice(0, 60)) + (String(done.question || "").length > 60 ? "…" : "") + "</p>" +
        '<a class="btn-urushi" href="' + go("05") + "?id=" + encodeURIComponent(done.id) + '">' + t({ ja: "答えを読む", en: "Read the answer", es: "Leer la respuesta", zh: "查看回答" }) + "</a></section>";
    } else {
      h += '<section class="main-block" aria-label="start">' +
        '<p class="quote-note" style="margin-top:0">' + t({ ja: "知りたいことを書くと、合う職人が見つかります。職人は日本語で答え、あなたの言葉に訳して届きます。", en: "Write what you want to learn and we will find the right craftsperson. They answer in Japanese, and it reaches you in your language.", es: "Escribe lo que quieres aprender y encontraremos al maestro adecuado. Responde en japonés y te llega en tu idioma.", zh: "写下你想了解的内容，就能找到合适的匠人。匠人用日语回答，再翻译成你的语言。" }) + "</p>" +
        '<a class="btn-urushi" href="' + go("18") + '">' + t({ ja: "職人を見つける", en: "Find your craftsperson", es: "Encuentra a tu maestro", zh: "找到你的匠人" }) + "</a></section>";
    }
    /* 使い方の3段：探す → 相談 → 答えが届く */
    h += '<h2 class="home-h2">' + t({ ja: "使い方", en: "How it works", es: "Cómo funciona", zh: "使用方法" }) + '</h2><ol class="how">' +
      '<li><a href="' + go("18") + '"><b>' + t({ ja: "職人を探す", en: "Find a craftsperson", es: "Encuentra a un maestro", zh: "寻找匠人" }) + "</b><small>" +
        t({ ja: "知りたいことを書くと、合う職人が理由つきで出ます", en: "Tell us what you want to learn; we show who fits, and why", es: "Di qué quieres aprender; te mostramos quién encaja y por qué", zh: "写下想学的内容，显示合适的匠人及理由" }) + "</small></a></li>" +
      '<li><a href="' + go("03") + '"><b>' + t({ ja: "写真をつけて相談する", en: "Ask with a photo", es: "Consulta con una foto", zh: "附照片咨询" }) + "</b><small>" +
        t({ ja: "自分の言葉で。職人には日本語で届きます", en: "In your own words. It reaches them in Japanese", es: "Con tus palabras. Le llega en japonés", zh: "用你自己的话，匠人收到的是日语" }) + "</small></a></li>" +
      "<li><div><b>" + t({ ja: "答えが、あなたの言葉で届く", en: "The answer arrives in your language", es: "La respuesta llega en tu idioma", zh: "回答以你的语言送达" }) + "</b><small>" +
        t({ ja: "盆栽の言葉に触ると、意味と理由が開きます。届いた答えは下の「あなたの相談」に出ます", en: "Tap a bonsai term to see what it means and why. Answers appear under “Your questions”", es: "Toca un término para ver qué significa y por qué. Las respuestas aparecen en “Tus consultas”", zh: "点击盆栽术语可查看含义与原因。回答会显示在“你的咨询”中" }) + "</small></div></li></ol>";
    h += myConsultations(cons);
    h += '<h2 class="home-h2">' + t({ ja: "学ぶ・用語集", en: "Learn and glossary", es: "Aprender y glosario", zh: "学习与术语表" }) + '</h2><ul class="menu">' +
      li(go("10"), t({ ja: "学ぶ", en: "Learn", es: "Aprender", zh: "学习" }), t({ ja: "盆栽の歴史と育て方", en: "History and care of bonsai", es: "Historia y cuidados", zh: "盆栽的历史与养护" })) +
      li(go("11"), t({ ja: "用語集", en: "Glossary", es: "Glosario", zh: "术语表" }), t({ ja: "直訳ではなく、意味と理由で", en: "Meaning and reason, not word for word", es: "Significado y motivo, no traducción literal", zh: "不是直译，而是含义与原因" })) +
      li(go("13"), t({ ja: "職人の紹介", en: "Meet the craftspeople", es: "Conoce a los maestros", zh: "匠人介绍" }), t({ ja: "得意な木と、教えられること", en: "What they know and what they can teach", es: "Qué saben y qué enseñan", zh: "擅长的树种与可教内容" })) +
      "</ul>" +
      '<figure class="hero-photo"><img src="共通/見本の写真_盆栽.jpg" alt=""><figcaption>' + t({ ja: "写真を送れば、職人があなたの木を見て答えます", en: "Send a photo, and a craftsperson looks at your own tree", es: "Envía una foto y un maestro mira tu propio árbol", zh: "发送照片，匠人会看着你的树回答" }) + "</figcaption></figure>" +
      '<p class="about demo-only"><a href="index.html">' + t({ ja: "この試作の紹介と、画面の一覧", en: "About this prototype and its screens", es: "Sobre este prototipo y sus pantallas", zh: "关于本试作与页面一览" }) + "</a></p>";
    home.innerHTML = h;
    /* 言葉の切り替え（はじめはログインのときに選んだ言語） */
    var row = $("lang-row");
    row.hidden = false;
    row.innerHTML = '<div class="lang" role="group" aria-label="Language">' + BONSAI.LANGS.map(function (l) {
      return '<button type="button" data-code="' + l.code + '" title="' + l.label + '">' + l.short + "</button>";
    }).join("") + "</div>";
    row.querySelectorAll("button").forEach(function (b) { b.addEventListener("click", function () { BONSAI.setLang(b.getAttribute("data-code")); }); });
    BONSAI.applyLang();
  }

  /* ログインしている人の役割でホームを決める（?role= より優先） */
  function setRole(isS) {
    shokunin = isS;
    document.body.classList.toggle("role-shokunin", isS);
    try { localStorage.setItem("bonsai-home-role", isS ? "shokunin" : "aikouka"); } catch (e) {}
    $("lang-row").hidden = true;
    BONSAI.refreshChrome();
  }

  function load() {
    failed = false;
    UI.state(home, "loading", shokunin ? { ja: "届いている相談を確かめています" } : { ja: "届いている答えを確かめています", en: "Checking for new answers…", es: "Buscando respuestas nuevas…", zh: "正在查看新的回答…" });
    API.me().then(function (m) {
      user = m.user;
      if (user && (user.role === "shokunin") !== shokunin) setRole(user.role === "shokunin");
      return Promise.all([getList("/api/consultations", "consultations"), shokunin ? getList("/api/trees", "trees") : Promise.resolve([])]);
    }).then(function (r) {
      /* つながらなかったときだけ知らせる（一部だけなら出せる分を出す） */
      if (failed && !r[0].length && !r[1].length) { UI.state(home, "error", null, { retry: load }); return; }
      if (shokunin) drawShokunin(r[0], r[1]); else drawAikouka(r[0]);
    });
  }
  load();
});
</script>
</body>
</html>
