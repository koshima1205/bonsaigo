<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>21 話すか撮るだけ・1鉢の記録と出品の下書き（職人）｜盆栽マッチング 試作</title>
<link rel="stylesheet" href="共通/見た目の決まり.css">
<style>
  .h1 { font-size: 1.75rem; }
  .pick input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .pick:focus-within { outline: 3px solid var(--koke); outline-offset: 2px; }
  .thumb { width: 100%; border-radius: var(--r); display: block; margin-top: var(--s3); }
  .wait { margin: var(--s5) 0; text-align: center; font-size: 1.25rem; font-weight: 700; color: var(--koke); }
  .err { margin-top: var(--s4); border: 2px solid var(--shu); border-radius: var(--r); padding: var(--s4); background: var(--shu-usu); font-size: 1.125rem; }
  .reply { margin-top: var(--s5); border-left: 3px solid var(--sumi); background: var(--koke-usu); color: var(--sumi); padding: var(--s4); font-size: 1.1875rem; line-height: 1.7; }
  .check { margin-top: var(--s3); border: 2px solid var(--shu); border-radius: var(--r); background: var(--shu-usu); padding: var(--s4); font-size: 1.0625rem; }
  .check b { color: var(--shu); }
  .check ul { margin: var(--s2) 0 0; padding-left: 1.2em; }
  .tree { margin-top: var(--s5); padding-top: var(--s5); border-top: 2px solid var(--sumi); }
  .tree__title { font-family: var(--mincho); font-size: 1.5rem; font-weight: 700; margin: var(--s3) 0 var(--s1); line-height: 1.4; }
  .tree__label { font-size: 1rem; font-weight: 700; color: var(--sumi-3); margin: var(--s5) 0 var(--s2); }
  .log { list-style: none; margin: 0; padding: 0 0 0 var(--s3); border-left: 2px solid var(--sen); font-size: 1.0625rem; line-height: 1.6; }
  .log li { margin-bottom: var(--s2); }
  .log small { display: block; color: var(--sumi-3); font-size: 14px; }
  .idea { display: block; width: 100%; text-align: left; margin-bottom: var(--s2); padding: var(--s3); min-height: 52px; background: var(--kami-3); border: 1px solid var(--sen); border-radius: var(--r); color: inherit; text-decoration: none; font-size: 1.0625rem; line-height: 1.5; }
  .choice { display: flex; gap: var(--s3); align-items: center; min-height: 48px; font-size: 1.125rem; }
  .choice input { width: 22px; height: 22px; }
  .listing { margin-top: var(--s4); border: 1px solid var(--sen); border-radius: var(--r); background: var(--kami-3); padding: var(--s4); }
  .listing h3 { font-family: var(--mincho); margin: 0 0 var(--s2); font-size: 1.25rem; line-height: 1.4; }
  .listing p { margin: 0 0 var(--s2); line-height: 1.6; }
  .state { display: inline-block; font-size: 14px; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: var(--shu-usu); color: var(--shu); margin-bottom: var(--s2); }
  .wanted { border-top: 1px solid var(--sen); padding: var(--s3) 0; }
  .wanted b { display: block; }
  .people { list-style: none; margin: 0; padding: 0; font-size: 1.0625rem; }
  .people li { display: flex; justify-content: space-between; gap: var(--s3); padding: var(--s3) 0; border-bottom: 1px solid var(--sen); }
</style>
</head>
<body data-screen="21" class="role-shokunin">
<div class="app">
  <header id="appbar"></header>
  <main class="page">
    <h1 class="h1">話すか撮るだけ。画面を覚えなくて大丈夫です。</h1>
    <p class="lead">やりたいことを言ってください。発信するのか、売りたいのか、AIが聞き分けて、木ごとの記録に残します。</p>

    <div class="big-actions">
      <label class="big-btn big-btn--main pick">
        <input type="file" id="in-photo" accept="image/*" capture="environment">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <span>写真を撮る</span>
      </label>
      <button type="button" class="big-btn" id="btn-talk">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <span id="talk-label">話す</span>
      </button>
    </div>
    <img class="thumb" id="thumb" alt="撮った写真" hidden>
    <label class="field" style="margin-top:var(--s4)">
      <span class="field__label" style="font-size:1rem">話した言葉（書いても大丈夫です）</span>
      <textarea class="textarea" id="voice" rows="3" style="font-size:1.125rem" placeholder="例：この木を海外の人に見せたい。売ってもいい。"></textarea>
    </label>
    <p class="note" id="voice-msg" hidden></p>
    <div class="big-actions" style="margin-top:var(--s3)">
      <button type="button" class="big-btn" id="btn-go">AIに任せる</button>
    </div>
    <button type="button" class="btn btn--wide" id="btn-sample" style="min-height:48px;margin-top:var(--s3)">見本の写真と言葉で試す</button>

    <p class="wait" id="wait" role="status" hidden>聞き分けています。少しお待ちください。</p>
    <div class="err" id="err" role="alert" hidden></div>

    <div id="answer" hidden>
      <p class="reply" id="reply"></p>
      <div class="check" id="check" hidden><b>ここだけ確かめてください</b><ul id="check-list"></ul></div>
      <div class="big-actions" id="next" style="margin-top:var(--s4)"></div>
    </div>

    <h2 class="h2" style="margin-top:var(--s7)">あなたの鉢</h2>
    <p class="note" id="empty">まだありません。話すか撮ると、木ごとの記録がここにできます。</p>
    <div id="trees"></div>

    <h2 class="h2" style="margin-top:var(--s7)">つながった海外の人</h2>
    <p class="note" id="people-empty">まだいません。相談が届くと、ここに並びます。</p>
    <ul class="people" id="people"></ul>

    <div class="big-actions" style="margin-top:var(--s6)"><a class="big-btn" href="20_職人に入るお金_職人.html">入るお金を見る</a></div>
  </main>
  <nav id="tabbar"></nav>
</div>
<script src="共通/用語集データ.js"></script>
<script src="共通/サンプルのデータ.js"></script>
<script src="共通/画面の共通の動き.js"></script>
<script src="共通/サーバーとのやりとり.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var $ = function (id) { return document.getElementById(id); };
  var image = null, trees = [], talking = false, busy = false;
  var SAMPLE_WORDS = "この木、海外の人に見せたい。売ってもええと思っとる。";
  var LOG_WHEN = function (at) { var d = new Date(at); return (d.getMonth() + 1) + "月" + d.getDate() + "日"; };
  var ACTION = {
    post: function (t) { return ["海外へ発信する投稿を作る", "17_撮るだけで発信_職人.html?tree=" + t.id]; },
    listing: function (t) { return ["出品の下書きを作る", "#tree-" + t.id]; },
    teach: function () { return ["先生に登録する", "19_話して先生に登録_職人.html"]; }
  };

  /* 輸出の流れは AI に書かせず、確かめた内容を固定で出す（農林水産省 植物防疫所のQ&Aとチラシ、2026-11-05 確認） */
  var EXPORT_HELP = '<details style="margin-top:var(--s3)"><summary style="min-height:44px;cursor:pointer;font-weight:700">海外へ送るまでの流れ</summary>' +
    '<ol style="margin:var(--s2) 0;padding-left:1.4em;line-height:1.7"><li>相手の国の条件を確かめる。同じ木でも、輸入禁止・事前の許可が要る・検査が要るなど、国で違います</li><li>条件に合わせて検査を申し込む（育てている場所の検査が要ることもあります）</li><li>検査の報告書をつけて、植物防疫所で証明書をもらう</li><li>送る</li></ol>' +
    '<p style="margin:0 0 var(--s2);line-height:1.6">EU・英国向けは、2026年9月1日から生産園地の登録なども必要です。アメリカなどほかの国の条件と、この木が送れるかは、ここでは確かめていません。植物防疫所と相手の国の機関にご確認ください。</p>' +
    '<a href="https://www.maff.go.jp/pps/j/business/export/faq/export_faq_japanese.html" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;min-height:44px">植物防疫所の輸出のQ&Aを開く</a></details>';

  function showErr(m) { $("err").textContent = m; $("err").hidden = false; }
  function list(items) { return items.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join(""); }

  function renderTree(t) {
    var photo = t.image ? '<img class="thumb" alt="' + esc(t.title_ja) + '" src="data:' + t.image.media_type + ";base64," + t.image.data + '">' : "";
    var ideas = (t.next_post_ideas_ja || []).map(function (i) {
      return '<a class="idea" href="17_撮るだけで発信_職人.html?tree=' + t.id + "&idea=" + encodeURIComponent(i) + '">' + esc(i) + "</a>";
    }).join("");
    var l = t.listing;
    var listing = l
      ? '<div class="listing"><span class="state">下書き。公開していません</span><p>' + (l.format === "auction" ? "売り方：入札で決める" : "売り方：決まった値段") + (l.price_note ? "（" + esc(l.price_note) + "）" : "") + "</p>" +
        "<h3 lang=\"en\">" + esc(l.title.en) + '</h3><p lang="en">' + esc(l.description.en) + "</p>" +
        "<p>" + esc(l.confirm_ja) + "</p>" +
        (l.wanted_matches.length ? '<p class="tree__label">探している人（サンプル）</p>' + l.wanted_matches.map(function (m) { return '<div class="wanted"><b>' + esc(m.wanted_ja) + "</b>" + esc(m.reason_ja) + (m.overseas ? '<small style="display:block;color:var(--shu);margin-top:4px">海外へ送るには検疫が要ります。時間がかかり、国によっては送れないこともあります。</small>' : "") + "</div>"; }).join("") : "") +
        (l.please_check_ja.length ? '<div class="check"><b>ここだけ確かめてください</b><ul>' + list(l.please_check_ja) + "</ul></div>" : "") +
        EXPORT_HELP +
        '<p class="note" style="margin-top:var(--s3)">この試作に、公開・入札・決済の機能はありません。</p></div>'
      : '<label class="choice"><input type="radio" name="f-' + t.id + '" value="fixed" checked>決まった値段で売る</label>' +
        '<label class="choice"><input type="radio" name="f-' + t.id + '" value="auction">入札で決める</label>' +
        '<label class="field"><span class="field__label" style="font-size:1rem">値段の希望（なければ空で大丈夫です）</span><input class="input" data-price="' + t.id + '" style="font-size:1.125rem" autocomplete="off"></label>' +
        '<button type="button" class="btn btn--main btn--wide" data-listing="' + t.id + '" style="min-height:56px;font-size:1.125rem">出品の下書きを作る</button>';
    return '<section class="tree" id="tree-' + t.id + '">' + photo + '<p class="tree__title">' + esc(t.title_ja) + "</p>" +
      '<p style="margin:0;line-height:1.7">' + esc(t.what_i_saw_ja) + "</p>" +
      '<p class="tree__label">この木の記録</p><ul class="log">' + t.log.map(function (e) { return "<li><small>" + LOG_WHEN(e.at) + "</small>" + esc(e.text) + "</li>"; }).join("") + "</ul>" +
      '<a class="btn btn--wide" href="17_撮るだけで発信_職人.html?tree=' + t.id + '" style="min-height:52px;margin-top:var(--s4)">この木の投稿を作る</a>' +
      (ideas ? '<p class="tree__label">次に出すとよい投稿の案</p>' + ideas : "") +
      '<p class="tree__label">売りたいとき</p>' + listing + "</section>";
  }
  function renderTrees() {
    $("empty").hidden = trees.length > 0;
    $("trees").innerHTML = trees.map(renderTree).join("");
  }
  function load() {
    return API.get("/api/trees").then(function (r) { trees = r.trees; renderTrees(); });
  }

  function go(voice, img) {
    if (busy) return;
    if (!voice && !img) { showErr("話すか、写真を撮ってください"); return; }
    if (talking && rec) rec.stop();
    busy = true; $("err").hidden = true; $("answer").hidden = true; $("wait").hidden = false;
    API.post("/api/trees", { voice: voice, images: img ? [{ media_type: img.media_type, data: img.data }] : [] }).then(function (t) {
      $("reply").textContent = t.reply_ja;
      var checks = (t.please_check_ja || []).concat(t.photo_problem_ja ? [t.photo_problem_ja] : []);
      $("check").hidden = !checks.length; $("check-list").innerHTML = list(checks);
      $("next").innerHTML = (t.wants.length ? t.wants : ["post"]).map(function (w, i) {
        var a = ACTION[w](t);
        return '<a class="big-btn' + (i === 0 ? " big-btn--main" : "") + '" href="' + a[1] + '">' + esc(a[0]) + "</a>";
      }).join("");
      $("answer").hidden = false;
      return load().then(function () { $("answer").scrollIntoView({ behavior: "smooth", block: "start" }); });
    }, function (e) { showErr(e.message); }).then(function () { busy = false; $("wait").hidden = true; });
  }

  $("in-photo").addEventListener("change", function (e) {
    var f = e.target.files[0]; e.target.value = "";
    if (f) API.photoFromFile(f).then(function (i) { image = i; $("thumb").src = i.url; $("thumb").hidden = false; }, function (er) { showErr(er.message); });
  });
  $("btn-go").addEventListener("click", function () { go($("voice").value.trim(), image); });
  $("btn-sample").addEventListener("click", function () {
    $("voice").value = SAMPLE_WORDS;
    API.samplePhoto().then(function (i) { image = i; $("thumb").src = i.url; $("thumb").hidden = false; go(SAMPLE_WORDS, i); });
  });

  var rec = API.makeRecognizer({
    onText: function (t) { $("voice").value = t; },
    onEnd: function () { talking = false; $("talk-label").textContent = "話す"; $("btn-talk").classList.remove("is-on"); },
    onError: function () { $("voice-msg").textContent = "声を聞き取れませんでした。書くか、見本で試せます。"; $("voice-msg").hidden = false; }
  });
  $("btn-talk").addEventListener("click", function () {
    if (!rec) { $("voice-msg").textContent = "この端末では声を使えません。書くか、見本で試せます。"; $("voice-msg").hidden = false; $("voice").focus(); return; }
    if (talking) { rec.stop(); return; }
    talking = true; $("voice-msg").hidden = true; $("talk-label").textContent = "聞いています（押すと終わり）"; $("btn-talk").classList.add("is-on");
    rec.start($("voice").value);
  });

  $("trees").addEventListener("click", function (e) {
    var b = e.target.closest("[data-listing]"); if (!b || b.disabled) return;
    var id = b.getAttribute("data-listing");
    var format = document.querySelector('input[name="f-' + id + '"]:checked').value;
    var price = document.querySelector('[data-price="' + id + '"]').value.trim();
    b.disabled = true; b.textContent = "下書きを書いています。少しお待ちください。";
    API.post("/api/trees/" + id + "/listing", { format: format, price_note: price }).then(function () {
      return load().then(function () { $("tree-" + id).scrollIntoView({ behavior: "smooth", block: "start" }); });
    }, function (er) { b.disabled = false; b.textContent = "出品の下書きを作る"; showErr(er.message); });
  });

  if (API.online) {
    load().then(function () { if (location.hash) { var el = document.querySelector(location.hash); if (el) el.scrollIntoView(); } }, function () {});
    API.get("/api/consultations").then(function (r) {
      var names = { en: "英語", es: "スペイン語", zh: "中国語", ja: "日本語" };
      $("people-empty").hidden = r.consultations.length > 0;
      $("people").innerHTML = r.consultations.map(function (c) {
        return "<li><span>" + esc(names[c.lang] || "") + "で相談した方<br><small>" + esc(c.for_craftsperson.title_ja) + "</small></span><b style=\"white-space:nowrap\">" + (c.answer ? "答えた" : "返事待ち") + "</b></li>";
      }).join("");
    }, function () {});
  }
});
</script>
</body>
</html>
